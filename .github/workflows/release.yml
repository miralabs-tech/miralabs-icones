name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.4.0). Must match package.json."
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Version matches package.json and is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::'$VERSION' is not a semver version"; exit 1; }
          pkg="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$VERSION" = "$pkg" || { echo "::error::input $VERSION ≠ package.json $pkg"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run codegen:check
      - run: bun run build:check
      - run: bun run typecheck
      - run: bun run typecheck:dist
      - run: bun test

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # npm CLI rather than bun publish: bun emits no provenance attestation.
      # Trusted publishing on npmjs.com matches this filename and the npm environment;
      # renaming either breaks the publish until npmjs.com is updated. Needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # dist/ is committed and checked by verify, so the tarball needs no build.
      - name: Publish to npm
        run: npm publish --access public --loglevel verbose

      # Runs after the publish: build:font writes dist/svg, which the package's `files` would pick up.
      - run: bun run build:font

      - name: Assemble the archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          cd dist
          zip -qr "../release/mira-icones-svg-$VERSION.zip" svg
          zip -qr "../release/mira-icones-font-$VERSION.zip" font
          zip -qr "../release/mira-icones-sprite-$VERSION.zip" sprite
          zip -q "../release/mira-icones-metadata-$VERSION.zip" metadata.json symbols.json ir.json
          cd ..
          ls -l release

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" release/*.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $prerelease
