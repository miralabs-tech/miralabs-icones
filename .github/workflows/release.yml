name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile

      - name: Le tag doit correspondre à package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$tag" = "$pkg" || { echo "::error::tag $GITHUB_REF_NAME ≠ package.json $pkg"; exit 1; }

      # Un tag fige ce que miralabs-ui installera : dist/ doit être à jour AVANT de publier.
      - name: dist/ correspond aux sources
        run: |
          bun run codegen:check
          bun run build:check
      - run: bun test

      # svg/ et les binaires de police ne sont ni versionnés ni dans le paquet : ils naissent ici.
      - run: bun run build:font

      - name: Assembler les archives
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cd dist
          zip -qr "../release/mira-icones-svg-$v.zip" svg
          zip -qr "../release/mira-icones-font-$v.zip" font
          zip -qr "../release/mira-icones-sprite-$v.zip" sprite
          zip -q "../release/mira-icones-metadata-$v.zip" metadata.json symbols.json ir.json
          cd ..
          ls -l release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true

  npm:
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # dist/ étant committé, le tarball se construit sans build : rien à régénérer ici.
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
